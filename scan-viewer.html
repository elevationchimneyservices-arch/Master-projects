<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polycam Scan Viewer</title>
<style>
  :root{--bg:#0e1116;--panel:#171c24;--line:#2a323d;--txt:#e6edf3;--muted:#9aa7b4;--accent:#58a6ff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #app{position:fixed;inset:0}
  #ui{position:fixed;top:12px;left:12px;width:320px;max-height:calc(100vh - 24px);overflow:auto;
    background:rgba(23,28,36,.92);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    backdrop-filter:blur(6px);z-index:10}
  h1{font-size:15px;margin:0 0 2px}.sub{font-size:11px;color:var(--muted);margin-bottom:10px}
  select{width:100%;background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:8px;font-size:13px;margin:4px 0 8px}
  .meta{font-size:11px;color:var(--muted);background:#10151c;border:1px solid var(--line);
    border-radius:8px;padding:8px;margin-bottom:8px;line-height:1.45}
  .meta b{color:var(--txt)}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .row label{flex:1;cursor:pointer}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;font-size:12px;cursor:pointer}button:hover{border-color:var(--accent)}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .drop{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;font-size:11px;
    color:var(--muted);margin:8px 0;cursor:pointer}
  .drop.hot{border-color:var(--accent);color:var(--txt)}
  .hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4}
  a{color:var(--accent);text-decoration:none}
  #status{position:fixed;bottom:10px;left:12px;font-size:11px;color:var(--muted);z-index:10}
  #dims{position:fixed;bottom:10px;right:12px;font-size:11px;color:var(--muted);z-index:10;text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>Polycam Scan Viewer</h1>
  <div class="sub">Elevation Chimney Services · multi-scan</div>

  <select id="pick"></select>
  <div class="meta" id="meta">Loading scan list…</div>

  <div class="drop" id="drop">⤓ or drag-and-drop a <b>.glb</b> here to preview it locally<br>
    <span style="opacity:.7">(local only — send it in chat to add it permanently)</span></div>

  <div class="btns"><button id="reset">Reset</button><button id="top">Top</button><button id="front">Front</button></div>
  <div class="row"><input type="checkbox" id="wire"><label for="wire">Wireframe</label></div>
  <div class="row"><input type="checkbox" id="rot"><label for="rot">Auto-rotate</label></div>
  <div class="row"><input type="checkbox" id="grid" checked><label for="grid">Floor grid (1 m)</label></div>

  <div class="hint">Drag to orbit · scroll to zoom. Back to the
    <a href="index.html">venting model</a>. Bounding-box size shows bottom-right.</div>
</div>
<div id="status"></div>
<div id="dims"></div>

<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e1116);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.01,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xcfe0f5,0x202020,1.0));
const dl=new THREE.DirectionalLight(0xffffff,1.4); dl.position.set(5,10,7); scene.add(dl);
const grid=new THREE.GridHelper(60,60,0x2a323d,0x1b2027); scene.add(grid);

const loader=new GLTFLoader();
let model=null, HOME=new THREE.Vector3(), R=5;
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;

function frame(){
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  model.position.sub(c); model.position.y += (c.y - box.min.y);
  R=Math.max(size.x,size.y,size.z)||5;
  HOME.set(R*0.9,R*0.7,R*0.9); camera.position.copy(HOME);
  controls.target.set(0,size.y*0.4,0); controls.update();
  const ft=v=>(v*3.281).toFixed(1);
  $('dims').innerHTML=`bbox ≈ ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m`+
    `<br>(${ft(size.x)} × ${ft(size.y)} × ${ft(size.z)} ft)`;
}
function setModel(gltf){
  if(model) scene.remove(model);
  model=gltf.scene; scene.add(model);
  if($('wire').checked) model.traverse(o=>{if(o.isMesh)o.material.wireframe=true;});
  frame();
}
function loadURL(url,label){
  status('Loading '+label+'…');
  loader.load(url, g=>{ setModel(g); status('Loaded: '+label); },
    undefined, e=>{ status('⚠ Could not load '+label+' (serve over http, not file://)'); console.error(e); });
}

// ---- manifest-driven dropdown ----
fetch('assets/scan/scans.json').then(r=>r.json()).then(j=>{
  const sel=$('pick'); sel.innerHTML='';
  (j.scans||[]).forEach((s,i)=>{ const o=document.createElement('option');
    o.value=i; o.textContent=s.label||s.file; sel.appendChild(o); });
  const scans=j.scans||[];
  function show(i){ const s=scans[i]; if(!s) return;
    $('meta').innerHTML=`<b>Type:</b> ${s.type||'—'}<br><b>Useful for:</b> ${s.useful_for||'—'}`+
      (s.notes?`<br><b>Notes:</b> ${s.notes}`:'');
    loadURL('assets/scan/'+s.file, s.label||s.file); }
  sel.onchange=()=>show(+sel.value);
  if(scans.length){ show(0); } else { $('meta').textContent='No scans listed yet.'; }
}).catch(()=>{ $('meta').innerHTML='Could not read <code>assets/scan/scans.json</code>.<br>'+
  'Serve over http (see README) or drag a .glb below.'; });

// ---- local drag/drop preview ----
const drop=$('drop');
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop',ev=>{ const f=ev.dataTransfer.files[0]; if(f) readFile(f); });
drop.addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file';
  inp.accept='.glb,.gltf'; inp.onchange=()=>inp.files[0]&&readFile(inp.files[0]); inp.click(); });
function readFile(f){ const u=URL.createObjectURL(f); loadURL(u,f.name+' (local)'); }

// ---- controls ----
$('reset').onclick=()=>{camera.position.copy(HOME);controls.target.set(0,R*0.3,0);};
$('top').onclick=()=>{camera.position.set(0.01,R*1.3,0.01);controls.target.set(0,0,0);};
$('front').onclick=()=>{camera.position.set(0,R*0.4,R*1.3);controls.target.set(0,R*0.3,0);};
$('grid').onchange=e=>grid.visible=e.target.checked;
let rot=false; $('rot').onchange=e=>rot=e.target.checked;
$('wire').onchange=e=>{ if(model) model.traverse(o=>{if(o.isMesh)o.material.wireframe=e.target.checked;}); };
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop); if(rot&&model)model.rotation.y+=0.003;
  controls.update(); renderer.render(scene,camera);})();
</script>
</body>
</html>
